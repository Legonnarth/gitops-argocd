apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.localhost"
      tls:
        mode: Terminate
        certificateRefs:
          - name: local-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
